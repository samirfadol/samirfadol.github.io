<div class="contact-icons">
  {{ with .Site.Params.email }}
  <a href="mailto:{{ . }}" class="contact-icon-link" aria-label="Email">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>

  {{ end }}
  {{ with .Site.Params.orcid }}
  <a href="{{ . }}" class="contact-icon-link" target="_blank" rel="noopener noreferrer" aria-label="ORCID">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zM7.5 4.5c1.38 0 2.5 1.12 2.5 2.5S8.88 9.5 7.5 9.5 5 8.38 5 7s1.12-2.5 2.5-2.5zm-1.5 12V10h3v6.5H6zm4.5 0V10h3v2.5c.83-1.5 2.83-2.5 4.5-2.5 2.76 0 5 2.24 5 5v1h-3v-1c0-1.1-.9-2-2-2s-2 .9-2 2v1h-3z"/>

  </a>
  {{ end }}
  {{ with .Site.Params.linkedin }}
  <a href="{{ . }}" class="contact-icon-link" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 114.127 0 2.063 2.063 0 01-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
