<nav class="site-nav" aria-label="Main navigation">
  <div class="nav-inner">
    <a class="nav-brand" href="{{ "/" | relURL }}">{{ .Site.Params.author }}</a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-menu">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <ul class="nav-links" id="nav-menu">
      {{ range .Site.Menus.main }}
      {{ $href := .URL }}
      {{ if and (eq .Name "CV") $.Site.Params.cv }}
        {{ $href = $.Site.Params.cv | relURL }}
      {{ end }}
      <li><a href="{{ $href }}"{{ with .Params.blank }} target="_blank" rel="noopener noreferrer"{{ end }}>{{ .Name }}</a></li>
      {{ end }}
    </ul>
  </div>
</nav>
